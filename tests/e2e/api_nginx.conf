events {}

http {
    server {
        listen 80;
        server_name api.jobsira.test;
        location / {
            default_type application/json;
            return 200 '{"service":"jobsira-api","version":"1.0"}';
        }
    }

    server {
        listen 443 ssl;
        server_name api.jobsira.test;
        ssl_certificate /etc/nginx/certs/api.jobsira.test.crt;
        ssl_certificate_key /etc/nginx/certs/api.jobsira.test.key;

        location / {
            default_type application/json;
            return 200 '{"service":"jobsira-api","version":"1.0"}';
        }
    }
}
