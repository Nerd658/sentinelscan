events {}

http {
    server {
        listen 80;
        server_name origin.jobsira.test;
        location / {
            return 301 https://jobsira.test/;
        }
    }

    server {
        listen 443 ssl;
        server_name origin.jobsira.test;
        ssl_certificate /etc/nginx/certs/jobsira.test.crt;
        ssl_certificate_key /etc/nginx/certs/jobsira.test.key;

        location / {
            return 301 https://jobsira.test/;
        }
    }
}
