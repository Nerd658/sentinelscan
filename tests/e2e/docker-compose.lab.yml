services:
  lab-nginx:
    image: nginx:alpine
    container_name: lab-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    networks:
      - sentinel-lab

  lab-apache:
    image: httpd:alpine
    container_name: lab-apache
    ports:
      - "8081:80"
    networks:
      - sentinel-lab

  lab-caddy:
    image: caddy:alpine
    container_name: lab-caddy
    ports:
      - "8082:2015"
    networks:
      - sentinel-lab

networks:
  sentinel-lab:
    name: sentinel-lab
    driver: bridge
