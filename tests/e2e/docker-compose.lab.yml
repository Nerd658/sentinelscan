version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lab-postgres
    environment:
      POSTGRES_DB: sentinelscan
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelscan"]
      interval: 2s
      timeout: 3s
      retries: 10
    networks:
      sentinel-lab:
        ipv4_address: 172.28.0.5

  redis:
    image: redis:7-alpine
    container_name: lab-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
    networks:
      sentinel-lab:
        ipv4_address: 172.28.0.6

  lab-dns:
    image: coredns/coredns:latest
    container_name: lab-dns
    volumes:
      - ./Corefile:/Corefile
    command: -conf /Corefile
    networks:
      sentinel-lab:
        ipv4_address: 172.28.0.53

  lab-nginx:
    image: nginx:alpine
    container_name: lab-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80/ || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 10
    networks:
      sentinel-lab:
        ipv4_address: 172.28.0.20
        aliases:
          - jobsira.test
          - www.jobsira.test
          - admin.jobsira.test

  lab-apache:
    image: httpd:alpine
    container_name: lab-apache
    networks:
      sentinel-lab:
        ipv4_address: 172.28.0.21

  lab-caddy:
    image: caddy:alpine
    container_name: lab-caddy
    networks:
      sentinel-lab:
        ipv4_address: 172.28.0.22

  lab-api:
    image: nginx:alpine
    container_name: lab-api
    volumes:
      - ./api_nginx.conf:/etc/nginx/nginx.conf
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80/ || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 10
    networks:
      sentinel-lab:
        ipv4_address: 172.28.0.30
        aliases:
          - api.jobsira.test

  lab-origin:
    image: nginx:alpine
    container_name: lab-origin
    volumes:
      - ./origin_nginx.conf:/etc/nginx/nginx.conf
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --spider -q https://127.0.0.1:443/ || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 10
    networks:
      sentinel-lab:
        ipv4_address: 172.28.0.40
        aliases:
          - origin.jobsira.test

  sentinelscan-runner:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile.runner
    container_name: sentinelscan-runner
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel_password@172.28.0.5:5432/sentinelscan?sslmode=disable
      REDIS_URL: redis://172.28.0.6:6379/0
    dns:
      - 172.28.0.53
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lab-nginx:
        condition: service_healthy
      lab-api:
        condition: service_healthy
      lab-origin:
        condition: service_healthy
    networks:
      sentinel-lab:
        ipv4_address: 172.28.0.100

networks:
  sentinel-lab:
    name: sentinel-lab
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
