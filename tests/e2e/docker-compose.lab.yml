version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lab-postgres
    environment:
      POSTGRES_DB: sentinelscan
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_password
    ports:
      - "5432:5432"
    networks:
      sentinel-lab:
        ipv4_address: 172.20.0.5

  redis:
    image: redis:7-alpine
    container_name: lab-redis
    ports:
      - "6379:6379"
    networks:
      sentinel-lab:
        ipv4_address: 172.20.0.6

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: lab-opensearch
    environment:
      - cluster.name=sentinel-cluster
      - node.name=sentinel-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"
    networks:
      sentinel-lab:
        ipv4_address: 172.20.0.7

  lab-dns:
    image: coredns/coredns:latest
    container_name: lab-dns
    volumes:
      - ./Corefile:/Corefile:ro
    command: -conf /Corefile
    networks:
      sentinel-lab:
        ipv4_address: 172.20.0.53

  lab-nginx:
    image: nginx:alpine
    container_name: lab-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      sentinel-lab:
        ipv4_address: 172.20.0.20
        aliases:
          - jobsira.test
          - www.jobsira.test
          - admin.jobsira.test

  lab-apache:
    image: httpd:alpine
    container_name: lab-apache
    networks:
      sentinel-lab:
        ipv4_address: 172.20.0.21

  lab-caddy:
    image: caddy:alpine
    container_name: lab-caddy
    networks:
      sentinel-lab:
        ipv4_address: 172.20.0.22

  lab-api:
    image: nginx:alpine
    container_name: lab-api
    volumes:
      - ./api_nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      sentinel-lab:
        ipv4_address: 172.20.0.30
        aliases:
          - api.jobsira.test

  lab-origin:
    image: nginx:alpine
    container_name: lab-origin
    volumes:
      - ./origin_nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      sentinel-lab:
        ipv4_address: 172.20.0.40
        aliases:
          - origin.jobsira.test

  lab-cdn:
    image: nginx:alpine
    container_name: lab-cdn
    volumes:
      - ./cdn_nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      sentinel-lab:
        ipv4_address: 172.20.0.10
        aliases:
          - cdn.jobsira.test

networks:
  sentinel-lab:
    name: sentinel-lab
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
