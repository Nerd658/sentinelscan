events {}

http {
    server {
        listen 8443 ssl;
        server_name cdn.jobsira.test jobsira.test;
        ssl_certificate /etc/nginx/certs/wildcard.jobsira.test.crt;
        ssl_certificate_key /etc/nginx/certs/wildcard.jobsira.test.key;

        location / {
            default_type text/html;
            return 200 '<html><head><title>Jobsira CDN Edge</title></head><body>CDN Proxy Front</body></html>';
        }
    }
}
