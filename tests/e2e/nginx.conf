events {}

http {
    server {
        listen 80;
        server_name jobsira.test www.jobsira.test;

        add_header Server "cloudflare" always;
        add_header CF-Ray "8b3f12345678-CDG" always;
        add_header X-CDN-Edge "Cloudflare-Edge" always;

        location / {
            default_type text/html;
            return 200 '<html><head><title>Jobsira Homepage</title></head><body>Welcome to Jobsira via CDN Edge</body></html>';
        }
    }

    server {
        listen 80;
        server_name admin.jobsira.test;

        add_header Server "cloudflare" always;
        add_header CF-Ray "8b3f12345678-CDG" always;

        location / {
            default_type text/html;
            return 200 '<html><head><title>Jobsira Admin</title></head><body>Welcome to Jobsira Admin Portal</body></html>';
        }
    }

    server {
        listen 443 ssl;
        server_name jobsira.test www.jobsira.test;
        ssl_certificate /etc/nginx/certs/jobsira.test.crt;
        ssl_certificate_key /etc/nginx/certs/jobsira.test.key;

        add_header Server "cloudflare" always;
        add_header CF-Ray "8b3f12345678-CDG" always;
        add_header X-CDN-Edge "Cloudflare-Edge" always;

        location / {
            default_type text/html;
            return 200 '<html><head><title>Jobsira Homepage</title></head><body>Welcome to Jobsira Secure via CDN Edge</body></html>';
        }
    }
}
