events {}

http {
    server {
        listen 80;
        server_name jobsira.test www.jobsira.test;
        location / {
            default_type text/html;
            return 200 '<html><head><title>Jobsira Homepage</title></head><body>Welcome to Jobsira Homepage</body></html>';
        }
    }

    server {
        listen 80;
        server_name admin.jobsira.test;
        location / {
            default_type text/html;
            return 200 '<html><head><title>Jobsira Admin</title></head><body>Welcome to Jobsira Admin Portal</body></html>';
        }
    }

    server {
        listen 443 ssl;
        server_name jobsira.test www.jobsira.test;
        ssl_certificate /etc/nginx/certs/jobsira.test.crt;
        ssl_certificate_key /etc/nginx/certs/jobsira.test.key;

        location / {
            default_type text/html;
            return 200 '<html><head><title>Jobsira Homepage</title></head><body>Welcome to Jobsira Secure Homepage</body></html>';
        }
    }
}
