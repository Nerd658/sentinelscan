events {}

http {
    server {
        listen 80;
        server_name jobsira.test www.jobsira.test;
        location / {
            default_type text/html;
            return 200 '<html><head><title>Jobsira Homepage</title></head><body>Welcome to Jobsira</body></html>';
        }
    }

    server {
        listen 80;
        server_name api.jobsira.test;
        location / {
            default_type application/json;
            return 200 '{"service":"jobsira-api","version":"1.0"}';
        }
    }

    server {
        listen 80;
        server_name admin.jobsira.test;
        location / {
            default_type text/html;
            return 200 '<html><head><title>Jobsira Admin</title></head><body>Admin Portal</body></html>';
        }
    }

    server {
        listen 80;
        server_name origin.jobsira.test;
        location / {
            return 301 https://jobsira.test/;
        }
    }
}
